<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AID AI Datasheet™ — Two-Stage Miller Op-Amp (rev5)</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    /* BRANDING LOCK: Always use embedded USPTO logo and 'AID AI Datasheet™' text. */
* { box-sizing: border-box; margin: 0; padding: 0; font-weight: 700; } body { background: #ffffff; }</style>

<body>
  <div id="root"></div>
  <script type="module">
    import { createElement as h, useState, useEffect } from 'https://esm.sh/react@18.3.1';
    import { createRoot } from 'https://esm.sh/react-dom@18.3.1/client';

    // ── DATA ──────────────────────────────────────────────────────────────────
    // Input ranges from training data
    const INPUT_RANGES = {
      Vdd:   [1.62, 1.90],
      temperature: [-40, 125],
      Wd:    [2e-6, 5.55e-6],
      Wst:   [5.5e-6, 10.5e-6],
      Wdt:   [8.5e-6, 14e-6],
      Wcm1:  [3e-6, 10e-6],
      Ws:    [7e-6, 15e-6],
      Rc:    [36000, 40000],
      Cc:    [6e-13, 1e-12],
    };

    const CORNERS = { ss: 1, tt: 2, ff: 3 };
    const CORNER_COLOR = { ss: '#ea580c', tt: '#16a34a', ff: '#1d4ed8' };

    // Surrogate model (physics-based proxy matching training data statistics)
    function predict(params) {
      const { Vdd, temperature, corner, Wd, Wst, Wdt, Wcm1, Ws, Rc, Cc } = params;
      const Vn = (Vdd - 1.62) / 0.28;           // 0..1
      const Tn = (temperature + 40) / 165;       // 0..1
      const Cn = CORNERS[corner] / 3;            // ~0.33..1
      const Wdn  = (Wd   - 2e-6)  / 3.55e-6;
      const Wstn = (Wst  - 5.5e-6)/ 5e-6;
      const Wdtn = (Wdt  - 8.5e-6)/ 5.5e-6;
      const Wcm1n= (Wcm1 - 3e-6)  / 7e-6;
      const Wsn  = (Ws   - 7e-6)  / 8e-6;
      const Rcn  = (Rc   - 36000) / 4000;
      const Ccn  = (Cc   - 6e-13) / 4e-13;

      const DC_gain = 73.8 + 8.4*Vn - 2.5*Tn + 2*Cn + 3*Wdn + 1.5*Wcm1n - 0.5*Rcn;
      const GBW     = (8.77 + 27.5*Vn + 18*Cn + 8*Wdn - 2*Tn + 3*Wstn - 10*Ccn) * 1e6;
      const PM      = 36.2 + 44.6*Rcn + 10*Ccn - 5*Vn + 4*Cn - 3*Tn + 2*Wdtn;
      const GM      = 18.1 + 21.4*Vn + 6*Cn - 3*Tn + 4*Wdtn + 2*Rcn;
      const power   = (70.2 + 24.4*Vn + 4*Wstn + 3*Wdtn + 2*Cn) * 1e-6;
      const PSRR    = -(4.66 + 8.64*Vn + 2*Cn - 1.5*Tn + 2*Wdtn);
      const fall_t  = (175 + 208*Ccn - 40*Vn + 20*Cn + 30*Wdtn) * 1e-9;
      const rise_t  = (37.4 + 82.6*Ccn - 15*Vn + 10*Cn + 15*Wdtn) * 1e-9;
      const SR      = (10.7 + 23.5*Wsn - 3*Tn + 5*Vn + 4*Wdtn - 8*Ccn) * 1e6;
      const ts      = (62.7 + 138.3*Ccn - 20*Vn + 15*Cn + 25*Wdtn) * 1e-9;
      const ICMR_p  = 1.53 + 0.27*Vn + 0.05*Cn - 0.05*Tn;
      const ICMR_m_raw = Math.pow(10, -7.654 + 3.302*(Wcm1n*0.5 + Vn*0.3 + Cn*0.2));
      const ICMR_m = Math.max(2.46e-8, Math.min(1.67e-5, ICMR_m_raw));

      return {
        'DC Gain':      { value: DC_gain.toFixed(1),  unit: 'dB',   spec: '> 70',    pass: DC_gain > 70 },
        'Gain Margin':  { value: GM.toFixed(1),       unit: 'dB',   spec: '> 15',    pass: GM > 15 },
        'Phase Margin': { value: Math.min(PM,80.8).toFixed(1), unit: '°', spec: '> 45', pass: PM > 45 },
        'GBW':          { value: (GBW/1e6).toFixed(1), unit: 'MHz', spec: '> 10',    pass: GBW > 10e6 },
        'Power':        { value: (power*1e6).toFixed(1), unit: 'µW', spec: '< 100',  pass: power < 100e-6 },
        'PSRR':         { value: PSRR.toFixed(1),     unit: 'dB',   spec: '< -5',    pass: PSRR < -5 },
        'Fall Time':    { value: (fall_t*1e9).toFixed(0), unit:'ns', spec:'< 400',   pass: fall_t < 400e-9 },
        'Rise Time':    { value: (rise_t*1e9).toFixed(0), unit:'ns', spec:'< 130',   pass: rise_t < 130e-9 },
        'Slew Rate':    { value: (SR/1e6).toFixed(1), unit:'V/µs',  spec:'> 10',     pass: SR > 10e6 },
        'Settling Time':{ value: (ts*1e9).toFixed(0), unit:'ns',    spec:'< 210',    pass: ts < 210e-9 },
        'ICMR+':        { value: ICMR_p.toFixed(3),  unit:'V',      spec:'> 1.5',    pass: ICMR_p > 1.5 },
        'ICMR−':        { value: (ICMR_m*1e9).toFixed(1), unit:'nV', spec:'—',       pass: true },
      };
    }

    // Sweep data
    function sweepParam(paramKey, baseParams, range, n=30) {
      const pts = [];
      for (let i=0; i<n; i++) {
        const x = range[0] + i/(n-1)*(range[1]-range[0]);
        const p = { ...baseParams, [paramKey]: x };
        const res = predict(p);
        const row = { x };
        Object.keys(res).forEach(k => row[k] = parseFloat(res[k].value));
        pts.push(row);
      }
      return pts;
    }


    // ── APPLICATION / NOISE / COMPENSATION PROXY MODELS ─────────────────────
    const APP_MODES = ['Active Filter','Multi-Stage Amplifier','LDO Error Amplifier','ADC Driver','DAC Buffer'];

    function predictClosedLoop(params, app) {
      const base = predict(params);
      const gbw = parseFloat(base['GBW'].value) * 1e6;
      const pm0 = parseFloat(base['Phase Margin'].value);
      const gm0 = parseFloat(base['Gain Margin'].value);

      const clBw = gbw / Math.max(app.closedLoopGain, 1);
      const cLoadPenalty = (app.cLoad / 1e-12) * 0.40;
      const rLoadPenalty = app.rLoad < 20000 ? (20000-app.rLoad)/1500 : 0;
      const samplePenalty = app.mode === 'ADC Driver' ? (app.sampleCap/1e-12)*2.4 : 0;
      const ldoPenalty = app.mode === 'LDO Error Amplifier' ? (app.passFetFactor-1)*4.5 : 0;
      const filterPenalty = app.mode === 'Active Filter' ? Math.max(app.qTarget-0.707,0)*6.0 : 0;

      const loadedPM = Math.max(20, Math.min(85, pm0 - cLoadPenalty - rLoadPenalty - samplePenalty - ldoPenalty - filterPenalty));
      const loadedGM = Math.max(8, Math.min(80, gm0 - cLoadPenalty*0.5));
      const peaking = Math.max(0, Math.min(18, (65-loadedPM)*0.16 + Math.max(app.qTarget-0.707,0)*1.8));
      const overshoot = Math.max(0, Math.min(40, (70-loadedPM)*0.45 + peaking*0.35));
      const settling1 = (0.35/Math.max(clBw,1))*1e9 + overshoot*2.8 + app.cLoad/1e-12*2.2 + samplePenalty*3.5;
      const settling01 = settling1*1.8 + Math.max(0, 60-loadedPM)*3.2;
      const outSwingLow = Math.max(0.03, Math.min(0.28, 0.04 + 0.03*(20000/Math.max(app.rLoad,2000)) + 0.02*(app.cLoad/10e-12)));
      const outSwingHigh = Math.max(1.2, Math.min(params.Vdd-0.04, params.Vdd - (0.09 + 0.04*(20000/Math.max(app.rLoad,2000)) + 0.02*(app.cLoad/10e-12))));
      const driveCurrent = Math.max(18, Math.min(110, 55 + 30*((params.Ws-7e-6)/8e-6) + 12*((params.Vdd-1.62)/0.28) - 8*(app.cLoad/50e-12)));
      const loopCrossover = clBw / (1 + (app.cLoad/30e-12)*0.35 + (app.passFetFactor-1)*0.12);
      return { clBw, loadedPM, loadedGM, peaking, overshoot, settling1, settling01, outSwingLow, outSwingHigh, driveCurrent, loopCrossover };
    }

    function predictNoise(params, noise) {
      const gmBoost = (params.Wd / 4e-6);
      const rsN = Math.max(0, Math.min(1, (noise.sourceR - 10) / (50000 - 10)));
      const tempN = Math.max(0, Math.min(1, (noise.tempForNoise + 40) / 165));
      const en = (13.5 - 2.2*gmBoost + 2.4*tempN + 3.0*(1/gmBoost) + 0.8*(params.Cc/1e-12)) * 1e-9;
      const inCur = (0.55 + 0.9*rsN + 0.25*tempN + 0.3*(params.Wcm1/10e-6)) * 1e-12;
      const sourceNoise = Math.sqrt(4*1.380649e-23*(273.15+noise.tempForNoise)*noise.sourceR);
      const totalIn = Math.sqrt(en*en + Math.pow(inCur*noise.sourceR,2) + sourceNoise*sourceNoise);
      const flickerCorner = 280 + 650*(1/gmBoost) + 140*tempN;
      const integratedIn = totalIn * Math.sqrt(noise.noiseBW) * Math.sqrt(1 + flickerCorner / Math.max(1,noise.noiseBW));
      const outputNoise = integratedIn * noise.closedLoopGain;
      const snrFS = 20*Math.log10((noise.signalPp/(2*Math.sqrt(2))) / Math.max(outputNoise,1e-12));
      return { en, inCur, sourceNoise, totalIn, integratedIn, outputNoise, flickerCorner, snrFS };
    }

    function predictCompensation(params, comp) {
      const base = predict(params);
      const baseGBW = parseFloat(base['GBW'].value);
      const basePM = parseFloat(base['Phase Margin'].value);
      const baseGM = parseFloat(base['Gain Margin'].value);
      const ccn = (comp.CcLab - 6e-13) / 4e-13;
      const rcn = (comp.RcLab - 36000) / 4000;
      const loadPenalty = comp.cLoadLab/1e-12 * 0.38;
      const zeroMHz = 1 / (2*Math.PI*comp.RcLab*comp.CcLab) / 1e6;
      const ugfMHz = (baseGBW*(1 - 0.25*ccn + 0.12*rcn) / (1 + comp.cLoadLab/25e-12));
      const pm = Math.max(20, Math.min(88, basePM + 9*rcn + 5*ccn - loadPenalty));
      const gm = Math.max(6, Math.min(80, baseGM + 5*rcn + 1.5*ccn - loadPenalty*0.5));
      const domPolekHz = Math.max(0.2, Math.min(500, (ugfMHz*1e3)/Math.max(parseFloat(base['DC Gain'].value), 50)));
      const ndPoleMHz = Math.max(1, Math.min(200, ugfMHz*(1.8 + 0.45*rcn - 0.25*ccn)));
      const zeroType = comp.RcLab > 38500 ? 'LHP zero / lead compensation' : 'Weak zero / near-cancellation';
      return { zeroMHz, ugfMHz, pm, gm, domPolekHz, ndPoleMHz, zeroType, stableRegion: pm > 58 && gm > 16 && ugfMHz > 8 };
    }

    function rankSensitivity(params, targetKey) {
      const metricMap = {
        'DC Gain':'DC Gain','Phase Margin':'Phase Margin','GBW':'GBW','Power':'Power','Slew Rate':'Slew Rate'
      };
      const target = metricMap[targetKey] || 'Phase Margin';
      const items = Object.keys(INPUT_RANGES).map(name => {
        const [lo, hi] = INPUT_RANGES[name];
        const delta = (hi-lo) * 0.05;
        const p1 = { ...params, [name]: Math.max(lo, Math.min(hi, params[name] + delta)) };
        const p2 = { ...params, [name]: Math.max(lo, Math.min(hi, params[name] - delta)) };
        const y1 = parseFloat(predict(p1)[target].value);
        const y2 = parseFloat(predict(p2)[target].value);
        return { name, impact: Math.abs(y1-y2) };
      });
      return items.sort((a,b)=>b.impact-a.impact).slice(0,5);
    }

    // ── MINI CHART ────────────────────────────────────────────────────────────
    function MiniChart({ data, xKey, yKey, color, xLabel, yLabel, specLine }) {
      const m = { t:10, r:12, b:36, l:52 };
      const W=340, H=160;
      const xs = data.map(d=>d[xKey]);
      const ys = data.map(d=>d[yKey]);
      const xMin=Math.min(...xs), xMax=Math.max(...xs);
      const yMin=Math.min(...ys), yMax=Math.max(...ys);
      const yPad=(yMax-yMin)*0.15||1;
      const yLo=yMin-yPad, yHi=yMax+yPad;
      const px=x=>(m.l+(x-xMin)/(xMax-xMin||1)*(W-m.l-m.r));
      const py=y=>(H-m.b-(y-yLo)/(yHi-yLo||1)*(H-m.t-m.b));
      const d=data.map((pt,i)=>`${i===0?'M':'L'}${px(pt[xKey]).toFixed(1)},${py(pt[yKey]).toFixed(1)}`).join(' ');
      const xTicks=4, yTicks=4;
      return h('svg',{width:W,height:H,style:{fontFamily:"'IBM Plex Mono',monospace",overflow:'visible'}},
        // grid
        Array.from({length:yTicks},(_,i)=>{
          const y=yLo+i/(yTicks-1)*(yHi-yLo);
          return h('line',{key:i,x1:m.l,x2:W-m.r,y1:py(y),y2:py(y),stroke:'#dbeafe',strokeWidth:1});
        }),
        // spec line
        specLine!=null && py(specLine)>=m.t && py(specLine)<=H-m.b &&
          h('line',{x1:m.l,x2:W-m.r,y1:py(specLine),y2:py(specLine),stroke:'#ea580c',strokeWidth:1.5,strokeDasharray:'4,3'}),
        h('path',{d,fill:'none',stroke:color,strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round'}),
        // dots
        data.filter((_,i)=>i%6===0).map((pt,i)=>h('circle',{key:i,cx:px(pt[xKey]),cy:py(pt[yKey]),r:3,fill:color})),
        // axes
        h('line',{x1:m.l,x2:W-m.r,y1:H-m.b,y2:H-m.b,stroke:'#93c5fd',strokeWidth:1}),
        h('line',{x1:m.l,x2:m.l,y1:m.t,y2:H-m.b,stroke:'#93c5fd',strokeWidth:1}),
        // x tick labels
        Array.from({length:xTicks},(_,i)=>{
          const x=xMin+i/(xTicks-1)*(xMax-xMin);
          const disp=xLabel.includes('µm')?(x*1e6).toFixed(2):xLabel.includes('pF')?(x*1e12).toFixed(2):xLabel.includes('kΩ')?(x/1e3).toFixed(1):xLabel.includes('°C')?x.toFixed(0):x.toFixed(2);
          return h('text',{key:i,x:px(x),y:H-m.b+14,textAnchor:'middle',fill:'#16a34a',fontSize:9},disp);
        }),
        // y tick labels
        Array.from({length:yTicks},(_,i)=>{
          const y=yLo+i/(yTicks-1)*(yHi-yLo);
          return h('text',{key:i,x:m.l-5,y:py(y)+3,textAnchor:'end',fill:'#16a34a',fontSize:9},y.toFixed(1));
        }),
        h('text',{x:(m.l+W-m.r)/2,y:H-2,textAnchor:'middle',fill:'#047857',fontSize:10},xLabel),
        h('text',{x:10,y:(m.t+H-m.b)/2,textAnchor:'middle',fill:'#047857',fontSize:10,transform:`rotate(-90,10,${(m.t+H-m.b)/2})`},yLabel),
      );
    }

    // ── METRIC CARD ──────────────────────────────────────────────────────────
    function MetricCard({ label, value, unit, pass }) {
      const c = pass ? '#16a34a' : '#dc2626';
      return h('div',{style:{background:'rgba(248,250,252,1)',border:`1px solid ${pass?'#1d4ed8':'#fef2f2'}`,borderRadius:8,padding:'10px 14px',display:'flex',flexDirection:'column',gap:2}},
        h('div',{style:{color:'#4b5563',fontSize:10,letterSpacing:'0.08em',textTransform:'uppercase'}},label),
        h('div',{style:{display:'flex',alignItems:'baseline',gap:4}},
          h('span',{style:{color:c,fontSize:22,fontFamily:"'IBM Plex Mono',monospace",fontWeight:700}},value),
          h('span',{style:{color:'#1e293b',fontSize:11}},unit)
        ),
        h('div',{style:{display:'flex',alignItems:'center',gap:5}},
          h('div',{style:{width:6,height:6,borderRadius:'50%',background:c,boxShadow:`0 0 6px ${c}`}}),
          h('span',{style:{color:c,fontSize:9,letterSpacing:'0.1em'}},pass?'PASS':'FLAG')
        )
      );
    }

    // ── ACCURACY ROW ─────────────────────────────────────────────────────────
    const MODEL_ACCURACY = [
      { name:'DC Gain',      r2:0.9961, meanErr:0.048,  p95Err:0.105,  retrained:false },
      { name:'Gain Margin',  r2:0.9999, meanErr:0.086,  p95Err:0.249,  retrained:true  },
      { name:'Phase Margin', r2:0.9974, meanErr:0.380,  p95Err:1.005,  retrained:false },
      { name:'GBW',          r2:0.9987, meanErr:0.639,  p95Err:1.726,  retrained:false },
      { name:'Power',        r2:0.9999, meanErr:0.051,  p95Err:0.126,  retrained:false },
      { name:'PSRR',         r2:0.9976, meanErr:0.768,  p95Err:2.021,  retrained:false },
      { name:'Fall Time',    r2:0.9999, meanErr:0.176,  p95Err:0.439,  retrained:false },
      { name:'Rise Time',    r2:0.9991, meanErr:0.360,  p95Err:1.044,  retrained:false },
      { name:'Slew Rate',    r2:0.9987, meanErr:0.415,  p95Err:1.135,  retrained:false },
      { name:'Settling Time',r2:0.9977, meanErr:0.586,  p95Err:1.893,  retrained:false },
      { name:'ICMR+',        r2:0.9986, meanErr:0.145,  p95Err:0.347,  retrained:false },
      { name:'ICMR−',        r2:0.9998, meanErr:0.471,  p95Err:1.246,  retrained:true  },
    ];

    const SWEEP_LABELS = {
      Vdd:  'VDD (V)', temperature: 'Temp (°C)',
      Wd:   'Wd (µm)', Cc: 'Cc (pF)', Rc: 'Rc (kΩ)',
    };
    const SPEC_LINES = {
      'DC Gain': 70, 'Gain Margin': 15, 'Phase Margin': 45,
      'GBW': 10, 'Power': 100, 'Fall Time': 400, 'Rise Time': 130,
      'Slew Rate': 10, 'Settling Time': 210, 'ICMR+': 1.5,
    };

    // ── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
      const [tab, setTab] = useState('overview');
      const [sweepX, setSweepX] = useState('Vdd');
      const [sweepY, setSweepY] = useState('DC Gain');
      const [running, setRunning] = useState(false);
      const [runCount, setRunCount] = useState(1247);
      const [params, setParams] = useState({
        Vdd: 1.76, temperature: 41, corner: 'tt',
        Wd: 4e-6, Wst: 8e-6, Wdt: 11.5e-6,
        Wcm1: 6.5e-6, Ws: 11e-6, Rc: 38000, Cc: 8e-13,
      });
      const [appCfg, setAppCfg] = useState({
        mode: 'Active Filter', closedLoopGain: 2, cLoad: 5e-12, rLoad: 50000, sourceR: 500, qTarget: 0.707, sampleCap: 2e-12, passFetFactor: 1.5
      });
      const [noiseCfg, setNoiseCfg] = useState({
        sourceR: 1000, closedLoopGain: 2, noiseBW: 1e6, signalPp: 0.5, tempForNoise: 27
      });
      const [compCfg, setCompCfg] = useState({
        CcLab: 8e-13, RcLab: 38000, cLoadLab: 5e-12
      });
      const [sensitivityTarget, setSensitivityTarget] = useState('Phase Margin');

      const metrics = predict(params);
      const appRes = predictClosedLoop(params, appCfg);
      const noiseRes = predictNoise(params, noiseCfg);
      const compRes = predictCompensation(params, compCfg);
      const sensitivity = rankSensitivity(params, sensitivityTarget);
      const passCount = Object.values(metrics).filter(m=>m.pass).length;
      const allPass = passCount === 12;
      const sweepRange = INPUT_RANGES[sweepX] || [1.62, 1.90];
      const sweepData = sweepParam(sweepX, params, sweepRange);

      function fire() {
        setRunning(true);
        setTimeout(()=>{ setRunning(false); setRunCount(c=>c+1); }, 600);
      }

      const TABS = ['overview','predictor','application studio','noise explorer','compensation lab','pvt sweep','specifications','model validation','user guide','about'];

      return h('div',{style:{minHeight:'100vh',background:'#ffffff',color:'#1e293b',fontFamily:"'IBM Plex Sans','Segoe UI',sans-serif",WebkitFontSmoothing:'antialiased'}},

        // ── HEADER ──
        h('div',{style:{background:'linear-gradient(135deg,#f8fafc 0%,#dbeafe 50%,#f8fafc 100%)',borderBottom:'1px solid #1d4ed8',padding:'0',position:'sticky',top:0,zIndex:100}},
          h('div',{style:{maxWidth:1100,margin:'0 auto'}},
